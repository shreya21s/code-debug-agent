[project]
name = "code-debug-ai-agent"
version = "0.1.0"
description = "Multi-agent code debug system: Supervisor -> Research -> Coding -> Testing -> Reviewer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.4.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=1.0.0",
    "langchain-text-splitters>=0.2.0",
    "chromadb>=0.5.0",
    "mcp>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "numpy>=1.20.0",
]

[project.scripts]
code-debug-agent = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "main.py"]

[tool.pyright]
extraPaths = ["demo_workspace"]


